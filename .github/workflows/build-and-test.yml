name: Build and Test Kive
on: push
jobs:
  build:
    runs-on: ubuntu-22.04
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # Opens tcp port on the host and service container
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KIVE_DB_USER: postgres
      KIVE_DB_PASSWORD: postgres
      KIVE_DB_HOST: localhost
      KIVE_STATIC_ROOT: /tmp/kive_test_static_root
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Update apt index
        run: sudo apt-get update
      - name: Install apt packages
        run: sudo apt-get install -y -q dh-autoreconf build-essential libarchive-dev squashfs-tools
      - name: Install node
        uses: actions/setup-node@v2
        with:
          node-version: '12.13.1'

      - name: Install Kive's Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Install node dependencies
        run: npm install

      - uses: actions/setup-go@v2
        with:
          go-version: '^1.15.6'
      - name: Install Singularity
        run: |
          sudo apt-get install -qq \
              build-essential \
              uuid-dev \
              libgpgme-dev \
              squashfs-tools \
              libseccomp-dev \
              wget \
              pkg-config \
              git \
              cryptsetup-bin
          git clone https://github.com/singularityware/singularity.git
          cd singularity
          git checkout -q tags/v3.6.3
          ./mconfig && \
              make -C ./builddir && \
              sudo make -C ./builddir install
          cd ..
          rm -rf singularity
          singularity --version
      - run: npm run test:travis
      - name: Test with pytest
        run: |
          cd kive
          python manage.py collectstatic --no-input
          coverage run -m pytest --flake8
      - name: Test API with pytest
        run: |
          cd api
          coverage run --source=kiveapi -m pytest
      - name: Upload main coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: kive
      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: api

  build-vm-smoke:
    name: Smoke test utils/dev build-vm
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install build-vm runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y incus rsync qemu-utils iproute2

      - name: Start and initialize Incus
        run: |
          sudo systemctl enable --now incus.service || true
          sudo systemctl enable --now incus.socket || true
          sudo systemctl start incus.service || true
          sudo systemctl start incus.socket || true
          # Initialize with a dir-backed storage pool, a bridge network, and default profile
          sudo incus admin init --preseed <<'EOF'
          config: {}
          networks:
          - name: incusbr0
            type: bridge
            config:
              ipv4.address: auto
              ipv4.nat: "true"
              ipv6.address: none
          storage_pools:
          - name: default
            driver: dir
          profiles:
          - name: default
            devices:
              eth0:
                name: eth0
                nictype: bridged
                parent: incusbr0
                type: nic
              root:
                path: /
                pool: default
                type: disk
          EOF
          sudo incus info

      - name: Run build-vm smoke test
        env:
          BUILD_VM_WORKDIR: ${{ runner.temp }}/kive-build-vm
        run: |
          mkdir -p "$BUILD_VM_WORKDIR"
          sudo --preserve-env=PATH,BUILD_VM_WORKDIR utils/dev build-vm ci-smoke --instance-type container --provision --workdir "$BUILD_VM_WORKDIR" --debug
          sudo --preserve-env=PATH,BUILD_VM_WORKDIR utils/dev validate-vm ci-smoke --instance-type container --workdir "$BUILD_VM_WORKDIR" --debug
          sudo --preserve-env=PATH,BUILD_VM_WORKDIR utils/dev test-api ci-smoke --workdir "$BUILD_VM_WORKDIR" --debug

      - name: Cleanup smoke-test instance
        if: always()
        env:
          BUILD_VM_WORKDIR: ${{ runner.temp }}/kive-build-vm
        run: |
          sudo incus delete -f ci-smoke || true
          sudo rm -rf "$BUILD_VM_WORKDIR"
